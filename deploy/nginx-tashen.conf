# ==========================================================
# shtashen.cn 站点 nginx 配置
# 使用方法见 DEPLOY.md
# 前提：ICP 备案已通过、页脚备案号已替换
# ==========================================================

# HTTP：备案通过后先上线 HTTP，证书签发后再放开下面的 443 配置
server {
    listen 80;
    server_name shtashen.cn www.shtashen.cn;

    root /var/www/tashen-website;
    index index.html;

    # 访问日志（按需保留）
    access_log /var/log/nginx/shtashen.access.log;
    error_log  /var/log/nginx/shtashen.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存（css/js/图片带版本号参数，可长期缓存）
    location ~* \.(css|js|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

